map ctrl+backspace send_text all \x17

background_image /home/waweru/Pictures/Wallpapers/desktopblur.jpg
background_image_layout scaled 
background_tint 0.90

# background_opacity 0.85
# background_blur 30

# Font
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.5

# Cursor
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Window
window_padding_width 10
confirm_os_window_close 0
remember_window_size yes
initial_window_width 1200
initial_window_height 750


# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Tabs
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style bold
inactive_tab_font_style normal

# Bell
enable_audio_bell no
visual_bell_duration 0

# Mouse
copy_on_select yes
mouse_hide_wait 2.0

# URL styling
# url_color #7aa2f7
url_style curly

# Selection colors
# selection_foreground #1a1b26
# selection_background #7aa2f7

# Shell integration
shell_integration enabled

# Clipboard
clipboard_control write-clipboard write-primary read-clipboard read-primary

# Scrolling
scrollback_lines 10000
wheel_scroll_multiplier 5.0

# Cursor trail
cursor_trail 1

# Window border
draw_minimal_borders yes

# Disable close confirmation
close_on_child_death no

# Layouts
enabled_layouts tall,stack,splits

# Startup
hide_window_decorations no

# Keybindings

map ctrl+shift+enter launch --type=os-window --cwd=current
map ctrl+shift+t launch --type=tab --cwd=current

map ctrl+alt+v launch --location=vsplit --cwd=current
map ctrl+alt+h launch --location=hsplit --cwd=current


# Navigate splits
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

# Font resize
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
# map ctrl+backspace change_font_size all 0

# Scrollback pager
scrollback_pager nvim -c 'set nonumber norelativenumber' -


# BEGIN_KITTY_THEME
# Ayu
include themes/ayu.conf
# END_KITTY_THEME
